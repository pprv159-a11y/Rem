name: Render Remotion video

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cinematic-4min

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system media and offline TTS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install edge-tts
      - name: Check Python scripts
        run: python -m py_compile scripts/generate_narration.py scripts/create_soundtrack.py
      - name: Type-check TypeScript
        run: npm run typecheck
      - name: Generate Russian narration
        run: python scripts/generate_narration.py
      - name: Create original ambient soundtrack
        run: python scripts/create_soundtrack.py
      - name: Render vertical MP4
        run: |
          mkdir -p out
          npx remotion render src/index.ts Main out/video.mp4
      - name: Validate rendered MP4
        run: |
          test -s out/video.mp4
          duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 out/video.mp4)
          echo "Rendered duration: ${duration}s"
          awk -v d="$duration" 'BEGIN { if (d < 29.9 || d > 30.1) exit 1 }'
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: remotion-test-30s-9x16
          path: out/video.mp4
          if-no-files-found: error
          retention-days: 14
