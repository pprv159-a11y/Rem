name: Render Remotion video

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: remotion-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Validate and render MP4
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Bootstrap and persist npm lockfile
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          if [[ ! -f package-lock.json ]]; then
            echo "No npm lockfile found; generating one from package.json."
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund

            target_branch="$GITHUB_REF_NAME"
            if [[ -n "$GITHUB_HEAD_REF" ]]; then target_branch="$GITHUB_HEAD_REF"; fi
            if [[ -n "$target_branch" ]] && { [[ "$GITHUB_EVENT_NAME" != "pull_request" ]] || [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; }; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add package-lock.json
              if ! git diff --cached --quiet; then
                git commit -m "chore: add npm lockfile"
                git push origin "HEAD:$target_branch"
              fi
            else
              echo "Lockfile generated for this run; repository write-back is unavailable for this pull request."
            fi
          fi

      - name: Install system media and fallback TTS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --upgrade pip edge-tts

      - name: Check Python scripts
        run: python -m py_compile scripts/generate_narration.py scripts/create_soundtrack.py scripts/validate_media.py

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Validate Remotion package versions
        run: npx remotion versions

      - name: List Remotion compositions
        run: npm run compositions

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Generate Russian narration
        run: python scripts/generate_narration.py

      - name: Create original ambient soundtrack
        run: python scripts/create_soundtrack.py

      - name: Validate generated audio
        run: python scripts/validate_media.py --assets-only

      - name: Render vertical MP4
        run: |
          mkdir -p out
          npm run render

      - name: Validate final MP4
        run: python scripts/validate_media.py --video out/video.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v7
        with:
          name: remotion-video-9x16
          path: out/video.mp4
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
