name: Render Remotion video

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: remotion-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Validate and render MP4
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install system media and fallback TTS tools
        env:
          DEBIAN_FRONTEND: noninteractive
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --upgrade pip edge-tts

      - name: Check Python scripts
        run: python -m py_compile scripts/generate_narration.py scripts/create_soundtrack.py scripts/validate_media.py

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Validate Remotion package versions
        run: npx remotion versions

      - name: List Remotion compositions
        run: npm run compositions

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Generate Russian narration
        run: python scripts/generate_narration.py

      - name: Create original ambient soundtrack
        run: python scripts/create_soundtrack.py

      - name: Validate generated audio
        run: python scripts/validate_media.py --assets-only

      - name: Render vertical MP4
        run: |
          mkdir -p out
          npm run render

      - name: Validate final MP4
        run: python scripts/validate_media.py --video out/video.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v7
        with:
          name: remotion-video-9x16
          path: out/video.mp4
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
